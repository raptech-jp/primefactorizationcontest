<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ゲーム | 素因数分解コンテスト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" 
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" />
    <link rel="stylesheet" href="/static/style.css" type="text/css" />
</head>
<body>
    <div class="container">
        <h1 class="text-center">この数を素因数分解しよう！</h1>
        <p id="score" class="text-center score-text"></p>      <!-- Current score display -->
        <p id="timer" class="text-center score-text text-danger">残り時間: 60秒</p>
        <p id="product" class="text-center product-text"></p>  <!-- The composite number to factorize -->
        <div class="d-grid gap-2 col-12 col-sm-6 mx-auto">
            <!-- Two input fields for the prime factors -->
            <div class="input-group">
                <input type="number" inputmode="numeric" pattern="\d*" id="prime1" name="prime1" placeholder="素数1" class="form-control form-control-lg" />
                <input type="number" inputmode="numeric" pattern="\d*" id="prime2" name="prime2" placeholder="素数2" class="form-control form-control-lg" />
            </div>
            <button id="checkButton" onclick="checkPrimes()" class="btn btn-primary btn-lg mt-2">答え合わせ</button>
        </div>
        <!-- Modal for result feedback (correct or incorrect) -->
        <div id="modal-container" class="modal-container">
            <div id="modal-content" class="modal-content">
                <p id="result" class="text-center product-text"></p>    <!-- "正解" or "不正解" -->
                <div id="button-container" class="text-center mt-2"></div> <!-- Next or Back button will be inserted here -->
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
